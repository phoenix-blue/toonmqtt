name: Release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"
          cache-dependency-path: daemon/go.mod

      - name: Test and build Toon ARMv7 binary
        run: ./scripts/build.sh

      - name: Check release layout and versions
        run: ./scripts/check-release.sh
